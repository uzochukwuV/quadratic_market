[project]
name = "quadratic-market-bot"
version = "1.0.0"
description = "Bot and API server for Quadratic Market protocol"
requires-python = ">=3.10"
dependencies = [
    "anchorpy>=0.20.0",
    "solders>=0.21.0",
    "solana>=0.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "structlog>=24.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.vercel]
nextjs = false
entrypoint = "api:app"
